name: Application regression checks
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'database/**'
      - 'games/guess/**'
      - 'deploy/ecs/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: histree-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regression:
    uses: ./.github/workflows/application-checks.yml
