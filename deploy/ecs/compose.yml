services:
  api:
    image: ${HISTREE_IMAGE:?Set HISTREE_IMAGE}
    container_name: histree-api
    restart: unless-stopped
    init: true
    env_file: /opt/histree/runtime.env
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1400m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000/api/v1/ask/status',{headers:{'x-histree-gateway-key':process.env.HISTREE_GATEWAY_SECRET||''}}).then(async r=>{if(!r.ok || !(await r.json()).available)throw Error('API unavailable')}),fetch('http://127.0.0.1:3000/people').then(async r=>{if(!r.ok || !(await r.text()).includes('<div id=\"root\"></div>'))throw Error('Frontend unavailable')})]).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
