<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>画卷显示对照 · Histree</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0 auto; max-width:720px; padding:20px 16px 40px; background:#f6f5ef; color:#294e43; font:15px/1.7 system-ui,sans-serif; }
    h1 { font-size:23px; margin:0 0 10px; } h2 { font-size:17px; margin:0 0 8px; }
    p { margin:8px 0 18px; } a { color:#315e4e; }
    section { margin:18px 0; padding:14px; border:1px solid #d7dfd0; border-radius:12px; background:#fffdf7; }
    .frame { width:100%; height:190px; background:#eee9dc; overflow:hidden; border-radius:8px; }
    .frame>img { display:block; width:100%; height:100%; object-fit:cover; object-position:center; }
    .frame>svg { display:block; width:100%; height:100%; }
    .background { background-image:url('/timeline-scroll/history-scroll-v6.webp'); background-size:cover; background-position:center; }
    .answers { display:flex; gap:24px; margin-top:12px; } label { padding:4px 0; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:12px; background:#eeeee4; border-radius:8px; font:12px/1.7 monospace; }
    .note { font-size:13px; color:#6d796b; }
  </style>
</head>
<body>
  <h1>画卷显示对照</h1>
  <p>请用出现空白的小米浏览器打开。下面六项使用同一张原图，请勾选哪些能看到山水人物；只有米色背景算“空白”。</p>
  <p class="note">诊断版本：scroll-render-1。无需登录，结果仅显示在本页，不会自动上传。</p>

  <section data-case="1"><h2>1 · 普通图片</h2>
    <div class="frame"><img src="/timeline-scroll/history-scroll-v6.webp" alt="山水城池人物长卷" id="plain-image"></div>
  </section>
  <section data-case="2"><h2>2 · 简单 SVG 图片</h2>
    <div class="frame"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="3900 0 1560 720">
      <image href="/timeline-scroll/history-scroll-v6.webp" xlink:href="/timeline-scroll/history-scroll-v6.webp" width="9360" height="720"></image>
    </svg></div>
  </section>
  <section data-case="3"><h2>3 · SVG 图片加裁剪</h2>
    <div class="frame"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 90 1000 589.2857142857143">
      <defs><clipPath id="direct-clip" clipPathUnits="userSpaceOnUse"><rect x="40" y="96" width="920" height="476.1428571428572" rx="12"></rect></clipPath></defs>
      <image clip-path="url(#direct-clip)" href="/timeline-scroll/history-scroll-v6.webp" xlink:href="/timeline-scroll/history-scroll-v6.webp" x="-3000.813953488372" y="96.0481727574751" width="6188.604651162791" height="476.046511627907"></image>
    </svg></div>
  </section>
  <section data-case="4"><h2>4 · 当前首页的 SVG 嵌套结构</h2>
    <div class="frame"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 90 1000 589.2857142857143" id="nested-original">
      <g aria-hidden="true" pointer-events="none"><defs><clipPath id="background-_r_1_"><rect x="40" y="96" width="920" height="476.1428571428572" rx="12"></rect></clipPath></defs><g clip-path="url(#background-_r_1_)"><rect x="40" y="96" width="920" height="476.1428571428572" fill="#f0ecdf"></rect><g transform="translate(0,0.048172757475100525)"><svg x="-3000.813953488372" width="6188.604651162791" height="476.046511627907" y="96" viewBox="0 0 9360 720" preserveAspectRatio="xMidYMid meet" overflow="hidden"><image href="/timeline-scroll/history-scroll-v6.webp" xlink:href="/timeline-scroll/history-scroll-v6.webp" width="9360" height="720"></image></svg></g></g></g>
    </svg></div>
  </section>
  <section data-case="5"><h2>5 · 脚本插入的 SVG 嵌套结构</h2>
    <div class="frame" id="dynamic-frame"></div>
  </section>
  <section data-case="6"><h2>6 · 普通背景图片</h2>
    <div class="frame background" role="img" aria-label="山水城池人物长卷"></div>
  </section>

  <h2>对照结果</h2>
  <p>勾选后，把下方结果复制给我，或直接告诉我能看到图的编号。</p>
  <pre id="report" aria-live="polite"></pre>
  <p><a href="/">返回正式首页</a></p>
  <script>
    (function () {
      var sections=document.querySelectorAll('section[data-case]');
      for(var i=0;i<sections.length;i++) {
        var number=sections[i].getAttribute('data-case');
        var choices=document.createElement('div');choices.className='answers';
        choices.innerHTML='<label><input type="radio" name="case-'+number+'" value="有图"> 有图</label><label><input type="radio" name="case-'+number+'" value="空白"> 空白</label>';
        sections[i].appendChild(choices);
      }
      var source=document.getElementById('nested-original');
      var dynamic=source.cloneNode(true);dynamic.removeAttribute('id');
      dynamic.innerHTML=dynamic.innerHTML.replace(/background-_r_1_/g,'dynamic-clip');
      document.getElementById('dynamic-frame').appendChild(dynamic);
      function update() {
        var lines=['诊断版本：scroll-render-1','浏览器：'+navigator.userAgent];
        for(var i=0;i<sections.length;i++) {
          var chosen=sections[i].querySelector('input:checked');
          lines.push((i+1)+'：'+(chosen?chosen.value:'未选择'));
        }
        var image=document.getElementById('plain-image');
        lines.push('普通图片解码：'+(image.naturalWidth?image.naturalWidth+'×'+image.naturalHeight:'尚未成功'));
        document.getElementById('report').textContent=lines.join('\n');
      }
      document.addEventListener('change',update);
      document.getElementById('plain-image').addEventListener('load',update);
      document.getElementById('plain-image').addEventListener('error',update);
      update();
    })();
  </script>
</body>
</html>
