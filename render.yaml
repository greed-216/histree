services:
  - type: web
    name: histree-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: HISTREE_ASK_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HISTREE_GATEWAY_SECRET
        sync: false
      - key: HISTREE_MODEL
        value: deepseek-flash
      - key: TRUST_PROXY
        value: "1"
